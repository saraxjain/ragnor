<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today's readiness</title>

</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:Lato,system-ui,sans-serif;color:#fff}
a{color:inherit;text-decoration:none}
@import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Merriweather:wght@700&display=swap');
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;padding:56px 24px 24px;background:#000;display:flex;flex-direction:column;gap:16px">
<div style="font-family:Merriweather,serif;font-weight:700;font-size:22px">Today's readiness</div>
<div style="background:#1C1C1C;border-radius:14px;padding:16px;display:flex;align-items:center;gap:16px">
<svg width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Moderate risk ring">
<circle cx="60" cy="60" r="50" fill="none" stroke="#2A2A2A" stroke-width="14"/>
<circle cx="60" cy="60" r="50" fill="none" stroke="#F5B301" stroke-width="14" stroke-dasharray="190 314" transform="rotate(-90 60 60)" stroke-linecap="round"/>
<text x="60" y="58" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Moderate</text>
<text x="60" y="76" text-anchor="middle" font-size="12" fill="#BBBBBB">risk</text>
</svg>
<div style="font-size:13px;color:#DDDDDD;display:flex;flex-direction:column;gap:6px">
<span><b style="color:#fff">1 flag</b> this week</span>
</div>
</div>
<a href="Act.dc.html" style="display:flex;flex-direction:column;gap:6px;background:#2B2410;border:1px solid #F5B301;border-radius:14px;padding:14px">
<div style="font-size:12px;font-weight:700;color:#F5B301">MODERATE RISK</div>
<div style="font-weight:700;font-size:15px;color:#fff">Flag: Lower back</div>
<div style="font-size:12px;color:#BBBBBB">Tap to see the flag detail</div>
</a>
<div style="background:#1C1C1C;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px">
<div style="font-weight:700;font-size:14px">Training load, last 7 days</div>
<svg viewBox="0 0 300 80" width="100%" height="80" role="img" aria-label="Line chart of training load rising over the last week">
<polyline points="0,60 45,55 90,58 135,50 180,46 225,40 270,22 300,14" fill="none" stroke="#A855F7" stroke-width="3"/>
<circle cx="270" cy="22" r="5" fill="#FF2D55"/>
</svg>
<div style="font-size:12px;color:#BBBBBB">Load went up about 30% this week. Hypothesis, not a verdict.</div>
</div>
<div style="background:#1C1C1C;border-radius:14px;padding:14px;font-size:13px">
<b>Flags today: 2</b> &nbsp; <span style="background:#FF2D55;color:#fff;border-radius:999px;padding:2px 8px;font-size:12px">Lower back</span>
</div>
<div style="margin-top:auto">
<a href="Act.dc.html" style="display:block;text-align:center;box-sizing:border-box;width:100%;min-height:52px;line-height:52px;border-radius:14px;background:#A855F7;color:#fff;font-size:16px;font-weight:700">See the flag</a>
</div>
</div>
</x-dc>
